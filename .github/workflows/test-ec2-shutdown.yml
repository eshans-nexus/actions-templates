name: EC2 Shutdown Lambda Tests

on:
  pull_request:
    branches:
      - main 
    paths:
      - 'aws/ec2-shutdown-lambda/v1/**'
      - 'aws/test_utils/**'
      - '.github/workflows/test-ec2-shutdown.yml'
  push:
    branches:
      - main 
    paths:
      - 'aws/ec2-shutdown-lambda/**'
      - 'aws/test_utils/**'
      - '.github/workflows/test-ec2-shutdown.yml'
jobs:
  unit-tests:
    runs-on: ${{ fromJSON(github.repository == 'mathworks-ref-arch/iac-building-blocks' && '["ubuntu-latest"]' || '["self-hosted", "runner-source=AWS", "Linux", "X64"]') }}
    defaults:
      run:
        working-directory: aws/ec2-shutdown-lambda/v1/
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ vars.TEST_TOOLING_PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements.txt

    - name: Run unit tests
      run: |
        pytest -v -s tests/test-ec2-shutdown-lambda.py
