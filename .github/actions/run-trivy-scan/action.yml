name: 'Run Trivy Scan (SSM)'
description: 'Generic action to install and run Trivy via AWS SSM on a target host.'

inputs:
  instance_id:
    description: 'EC2 Instance ID of the target machine'
    required: true
  os_type:
    description: 'Operating System: "linux" or "windows"'
    required: true
  asset_name:
    description: 'Name of asset being scanned (e.g. AMI ID, Image Name)'
    required: false
    default: 'Target Asset'
  timeout_minutes:
    description: 'Maximum time to wait for the SSM command to finish (in minutes)'
    required: false
    default: '10'

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      shell: bash
      run: pip install boto3

    - name: Run Python Scan Script
      shell: bash
      env:
        # Boto3 will automatically use standard AWS credentials configured by aws-actions/configure-aws-credentials
        AWS_DEFAULT_REGION: ${{ env.AWS_REGION || env.AWS_DEFAULT_REGION }}
      run: |
        python ${{ github.action_path }}/run_scan.py \
          --instance-id "${{ inputs.instance_id }}" \
          --os-type "${{ inputs.os_type }}" \
          --asset-name "${{ inputs.asset_name }}" \
          --timeout-minutes "${{ inputs.timeout_minutes }}" \
          --config "${{ github.action_path }}/scan_config.json"